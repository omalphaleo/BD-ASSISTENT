# Local development only. Values come from the root .env (copy .env.example); no secrets here.
# Start:  docker compose up -d db api worker
# Frontend is optional and off by default: docker compose --profile frontend up

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432" # localhost only, never exposed on other interfaces
    volumes:
      - pgdata:/var/lib/postgresql/data # Persist database data across container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s    #Runs the health check every 5 seconds.
      timeout: 3s     # If the health check doesn't respond within 3 seconds, it is considered failed.
      retries: 10     # After 10 consecutive failures, Docker marks the container as unhealthy.

  api:
    build:
      context: ./BD_BACKEND
      args:
        INSTALL_DEV: "true" # Install dev dependencies for local development (e.g. alembic, procrastinate)
    image: alphaleo-bd-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: development
      SESSION_COOKIE_SECURE: "false" # local compose runs over plain HTTP, so Secure cookies would never be sent
      UPLOAD_DIR: /srv/uploads # import files (M2-A1); the same volume is mounted in the worker
    volumes:
      - uploads:/srv/uploads # persistent import files, shared with the worker
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000" # start the API server
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy # Wait for the database to be healthy before starting the API


  worker:
    image: alphaleo-bd-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_ENV: development
      UPLOAD_DIR: /srv/uploads # same directory as the api, so the worker can read uploaded files
    volumes:
      - uploads:/srv/uploads # shared with the api
    command: >
      sh -c "procrastinate --app=app.worker.app schema --apply || echo 'Procrastinate schema already applied, continuing';
             procrastinate --app=app.worker.app worker"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started # api builds the image and runs migrations first

  frontend: # Dockerfile verified (B1); compose profile verified (B5)
    profiles: ["frontend"]
    build:
      context: ./BD_FRONTEND
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      # Server-side calls (session check) reach the API by its compose service name; the browser
      # keeps using NEXT_PUBLIC_API_BASE_URL above.
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  uploads: # uploaded import files, shared by api and worker (M2-A1)
