# Backend package metadata and runtime/dev dependencies.
# Docker and local Python environments install this package so the API, worker, and Alembic share the same stack.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaleo-bd-backend"
version = "0.0.1"
description = "Alphaleo BD backend: FastAPI API and Procrastinate worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "pydantic~=2.9",
    "pydantic-settings~=2.6",
    "sqlalchemy~=2.0",
    "alembic~=1.14",
    "psycopg[binary,pool]~=3.2",
    "procrastinate~=3.0",
    "argon2-cffi~=25.1",
    "pgvector",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "httpx~=0.28",
    "ruff~=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in argument defaults is the idiomatic pattern
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
